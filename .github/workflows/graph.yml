name: graph

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

    - name: Checker le code
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Afficher heure d execution
      run: |
        echo "=== Heure d'exécution ==="
        echo "UTC  : $(date -u)"
        echo "Local: $(date)"

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_graph.txt

    - name: Exécuter le script Python
      env:
        GRAPH_TOKEN: ${{ secrets.GRAPH_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python graph_telegram.py

    - name: Sauvegarder offset.txt
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add offset.txt
        git diff --cached --quiet || git commit -m "Update Telegram offset"
        git push
